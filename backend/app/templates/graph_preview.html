<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuggestIT - Taste Network Graph (Kapsamlı Zevk Haritası)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: #090a0f;
      color: #f1f5f9;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    svg {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    svg:active {
      cursor: grabbing;
    }
    /* Üst Kontrol Paneli */
    .top-bar {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 40px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
      width: 220px;
    }
    .top-bar button {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .top-bar button:hover {
      transform: scale(1.04);
      box-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
    }
    .top-bar .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }
    .top-bar .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }
    /* Sol Bilgi Kartı (Arketip) */
    .archetype-card {
      position: absolute;
      bottom: 28px;
      left: 28px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      max-width: 380px;
      z-index: 100;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .archetype-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #00f2fe;
      background: rgba(0, 242, 254, 0.12);
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .archetype-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .archetype-tagline {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
      font-style: italic;
    }
    .archetype-desc {
      font-size: 13px;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 16px;
    }
    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 12px;
      color: #94a3b8;
    }
    .stats-pill {
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 8px;
      color: #e2e8f0;
    }
    /* Lejant (Legend) */
    .legend {
      position: absolute;
      bottom: 28px;
      right: 28px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px 20px;
      z-index: 100;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-title {
      font-weight: 700;
      color: #94a3b8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    /* D3 SVG Stilleri */
    .links line {
      stroke-width: 1px;
      transition: stroke 0.3s ease;
    }
    .nodes circle {
      stroke: #090a0f;
      stroke-width: 1.5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .nodes circle:hover {
      stroke: #ffffff;
      stroke-width: 3px;
      filter: drop-shadow(0 0 14px currentColor);
    }
    .node-label {
      font-size: 10px;
      font-weight: 600;
      fill: #e2e8f0;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }
    /* Tooltip */
    #tooltip {
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 200;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- Üst Arama & Kontrol Çubuğu -->
  <div class="top-bar">
    <input type="text" id="usernameInput" placeholder="Letterboxd Kullanıcı Adı" value="dave" />
    <button onclick="loadLetterboxd()">Ağımı Çiz</button>
    <button class="btn-secondary" onclick="loadSampleIMDb()">Örnek IMDb Portföyü</button>
  </div>

  <!-- SVG Alanı -->
  <div id="canvas-container">
    <svg id="graph-svg"></svg>
  </div>

  <!-- Sol Bilgi Kartı -->
  <div class="archetype-card" id="archetypeCard">
    <div class="archetype-badge">Sinematik Zevk DNA'sı</div>
    <div class="archetype-title" id="archTitle">Yükleniyor...</div>
    <div class="archetype-tagline" id="archTagline">Tüm izleme geçmişiniz analiz ediliyor</div>
    <div class="stats-row" id="statsRow">
      <div class="stats-pill" id="statCount">Toplam: -</div>
      <div class="stats-pill" id="statRating">Ort. Puan: -</div>
    </div>
    <div class="archetype-desc" id="archDesc">Lütfen bekleyin...</div>
    <div class="tags" id="archTags"></div>
  </div>

  <!-- Lejant -->
  <div class="legend">
    <div class="legend-title">Ağ Örüntüleri & Düğümler</div>
    <div class="legend-item"><div class="legend-dot" style="background: #00f2fe; box-shadow: 0 0 8px #00f2fe;"></div><span>Türler (Sci-Fi, Crime vb.)</span></div>
    <div class="legend-item"><div class="legend-dot" style="background: #a18cd1; box-shadow: 0 0 8px #a18cd1;"></div><span>Dönem / Yıl (Decades)</span></div>
    <div class="legend-item"><div class="legend-dot" style="background: #f9d423; box-shadow: 0 0 8px #f9d423;"></div><span>Yönetmenler (Sarı)</span></div>
    <div class="legend-item"><div class="legend-dot" style="background: #ff9a9e; box-shadow: 0 0 8px #ff9a9e;"></div><span>Dizi Formatı (Mercan)</span></div>
    <div class="legend-item"><div class="legend-dot" style="background: #ffffff; box-shadow: 0 0 6px #ffffff;"></div><span>Yüksek Puanlı Yapımlar (8-10)</span></div>
    <div class="legend-item"><div class="legend-dot" style="background: #ff6b6b; box-shadow: 0 0 6px #ff6b6b;"></div><span>Düşük Puanlılar / Negatif Alan (<6)</span></div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip"></div>

  <script>
    const svg = d3.select("#graph-svg");
    const container = document.getElementById("canvas-container");
    let width = container.clientWidth;
    let height = container.clientHeight;

    const g = svg.append("g");

    // Zoom & Pan
    const zoom = d3.zoom()
      .scaleExtent([0.15, 4])
      .on("zoom", (event) => {
        g.attr("transform", event.transform);
      });
    svg.call(zoom);

    let simulation;

    function renderGraph(graphData) {
      g.selectAll("*").remove();

      // Arketip Kartını Güncelle
      const arch = graphData.archetype;
      document.getElementById("archTitle").innerText = arch.title;
      document.getElementById("archTagline").innerText = arch.tagline;
      document.getElementById("archDesc").innerText = arch.description;
      document.getElementById("statCount").innerText = `🎬 Toplam: ${arch.total_watched} Yapım`;
      document.getElementById("statRating").innerText = arch.average_rating ? `⭐ Ort: ${arch.average_rating}/10` : '⭐ Ort: -';

      const tagsContainer = document.getElementById("archTags");
      tagsContainer.innerHTML = "";
      arch.dominant_genres.forEach(genre => {
        const span = document.createElement("span");
        span.className = "tag";
        span.innerText = "# " + genre;
        tagsContainer.appendChild(span);
      });
      if (arch.cinematic_era) {
        const eraSpan = document.createElement("span");
        eraSpan.className = "tag";
        eraSpan.innerText = "⏳ " + arch.cinematic_era;
        tagsContainer.appendChild(eraSpan);
      }

      // D3 Force Simulation (Büyük ağlar için optimize edilmiş kuvvetler)
      simulation = d3.forceSimulation(graphData.nodes)
        .force("link", d3.forceLink(graphData.edges).id(d => d.id).distance(d => {
          if (d.relation === "from_decade") return 90;
          if (d.relation === "has_genre") return 70;
          if (d.relation === "directed_by") return 80;
          return 130;
        }).strength(0.5))
        .force("charge", d3.forceManyBody().strength(d => {
          if (d.type === "genre" || d.type === "decade") return -280;
          if (d.type === "director") return -180;
          return -60;
        }))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(d => d.size + 6));

      // Kenarlar (Relation türüne göre renk)
      const link = g.append("g")
        .attr("class", "links")
        .selectAll("line")
        .data(graphData.edges)
        .enter().append("line")
        .attr("stroke-opacity", 0.25)
        .attr("stroke", d => {
          if (d.relation === "from_decade") return "#a18cd1";
          if (d.relation === "co_genre") return "#00f2fe";
          if (d.relation === "directed_by") return "#f9d423";
          if (d.relation === "has_format") return "#ff9a9e";
          return "#ffffff";
        });

      // Düğümler
      const node = g.append("g")
        .attr("class", "nodes")
        .selectAll("g")
        .data(graphData.nodes)
        .enter().append("g")
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended));

      node.append("circle")
        .attr("r", d => d.size)
        .attr("fill", d => d.color)
        .style("filter", d => {
          if (d.type === "title") return "none";
          return `drop-shadow(0 0 8px ${d.color})`;
        });

      // Sadece ana düğümlere (Tür, Dönem, Yönetmen, Format) veya yüksek puanlı filmlere isim yaz
      node.append("text")
        .attr("class", "node-label")
        .attr("text-anchor", "middle")
        .attr("dy", d => d.size + 12)
        .text(d => {
          if (d.type !== "title") return d.label;
          if (d.rating && d.rating >= 8.5) return d.label;
          return "";
        });

      // Tooltip Etkileşimi
      const tooltip = d3.select("#tooltip");
      node.on("mouseover", (event, d) => {
        let typeBadge = d.type.toUpperCase();
        if (d.type === "decade") typeBadge = "DÖNEM / ÇIKIŞ YILI";
        if (d.type === "genre") typeBadge = "SİNEMA TÜRÜ";
        if (d.type === "director") typeBadge = "YÖNETMEN";
        if (d.type === "format") typeBadge = "FORMAT";

        tooltip.style("opacity", 1)
          .html(`
            <strong>${d.label}</strong><br/>
            <span style="color:#94a3b8">${typeBadge}</span><br/>
            ${d.rating !== null && d.rating !== undefined ? `<span>Puan: ⭐ ${d.rating}/10</span><br/>` : ''}
            ${d.year ? `<span>Çıkış Yılı: 📅 ${d.year}</span>` : ''}
          `);
      })
      .on("mousemove", (event) => {
        tooltip.style("left", (event.pageX + 15) + "px")
               .style("top", (event.pageY - 15) + "px");
      })
      .on("mouseout", () => {
        tooltip.style("opacity", 0);
      });

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
      });
    }

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }

    // Letterboxd Verisi ile Canlı Ağ Çizdir
    async function loadLetterboxd() {
      const username = document.getElementById("usernameInput").value.trim() || "dave";
      document.getElementById("archTitle").innerText = "Veri Çekiliyor...";
      document.getElementById("archDesc").innerText = `${username} için tüm izleme geçmişi ve örüntüler analiz ediliyor...`;

      try {
        const syncResp = await fetch("/api/v1/sync/letterboxd-url", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: username })
        });
        const syncData = await syncResp.json();

        const graphResp = await fetch("/api/v1/graph/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(syncData.items)
        });
        const graphData = await graphResp.json();
        renderGraph(graphData);
      } catch (err) {
        alert("Ağ yüklenirken hata oluştu: " + err);
      }
    }

    // Örnek IMDb Portföyü ile Canlı Ağ Çizdir
    async function loadSampleIMDb() {
      document.getElementById("archTitle").innerText = "IMDb Portföyü Analiz Ediliyor...";
      const sampleTitles = [
        { title: "Inception", year: 2010, user_rating: 9.5, title_type: "movie" },
        { title: "Interstellar", year: 2014, user_rating: 9.0, title_type: "movie" },
        { title: "The Dark Knight", year: 2008, user_rating: 10.0, title_type: "movie" },
        { title: "Fight Club", year: 1999, user_rating: 8.5, title_type: "movie" },
        { title: "Se7en", year: 1995, user_rating: 9.0, title_type: "movie" },
        { title: "Breaking Bad", year: 2008, user_rating: 10.0, title_type: "tvSeries" },
        { title: "Better Call Saul", year: 2015, user_rating: 9.5, title_type: "tvSeries" },
        { title: "Dune", year: 2021, user_rating: 8.5, title_type: "movie" },
        { title: "Blade Runner 2049", year: 2017, user_rating: 9.0, title_type: "movie" },
        { title: "Oppenheimer", year: 2023, user_rating: 9.0, title_type: "movie" },
        { title: "Tenet", year: 2020, user_rating: 7.0, title_type: "movie" },
        { title: "The Matrix", year: 1999, user_rating: 9.5, title_type: "movie" },
        { title: "Pulp Fiction", year: 1994, user_rating: 9.0, title_type: "movie" },
        { title: "Goodfellas", year: 1990, user_rating: 8.5, title_type: "movie" },
        { title: "Taxi Driver", year: 1976, user_rating: 8.0, title_type: "movie" },
        { title: "The Godfather", year: 1972, user_rating: 10.0, title_type: "movie" },
        { title: "The Substance", year: 2024, user_rating: 8.5, title_type: "movie" },
        { title: "Anora", year: 2024, user_rating: 8.0, title_type: "movie" },
        { title: "Gladiator II", year: 2024, user_rating: 5.5, title_type: "movie" }, // Düşük puan örneği
        { title: "Kötü Bir Film Örneği", year: 2022, user_rating: 3.0, title_type: "movie" } // Düşük puan örneği
      ];

      const graphResp = await fetch("/api/v1/graph/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(sampleTitles)
      });
      const graphData = await graphResp.json();
      renderGraph(graphData);
    }

    // İlk açılışta yükle
    window.addEventListener("DOMContentLoaded", async () => {
      const stored = localStorage.getItem('suggestit_titles');
      if (stored) {
        try {
          const titles = JSON.parse(stored);
          document.getElementById("archTitle").innerText = "Yüklenen CSV Analiz Ediliyor...";
          const graphResp = await fetch("/api/v1/graph/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(titles)
          });
          const graphData = await graphResp.json();
          renderGraph(graphData);
        } catch(e) {
          console.error("Local storage veri işleme hatası", e);
          loadSampleIMDb();
        }
      } else {
        loadSampleIMDb();
      }
    });

    window.addEventListener("resize", () => {
      width = container.clientWidth;
      height = container.clientHeight;
      if (simulation) {
        simulation.force("center", d3.forceCenter(width / 2, height / 2));
        simulation.alpha(0.3).restart();
      }
    });
  </script>
</body>
</html>
