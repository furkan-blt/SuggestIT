<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuggestIT - Taste Network Graph (Canlı Zevk Haritası)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: #090a0f;
      color: #f1f5f9;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    svg {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    svg:active {
      cursor: grabbing;
    }
    /* Üst Kontrol Paneli */
    .top-bar {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .top-bar input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      outline: none;
      font-size: 14px;
      width: 200px;
    }
    .top-bar button {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .top-bar button:hover {
      transform: scale(1.04);
      box-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
    }
    .top-bar .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
    }
    .top-bar .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }
    /* Sol Bilgi Kartı (Arketip) */
    .archetype-card {
      position: absolute;
      bottom: 28px;
      left: 28px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      max-width: 360px;
      z-index: 100;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .archetype-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #00f2fe;
      background: rgba(0, 242, 254, 0.12);
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .archetype-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .archetype-tagline {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
      font-style: italic;
    }
    .archetype-desc {
      font-size: 13px;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 16px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 8px;
      color: #e2e8f0;
    }
    /* Lejant (Legend) */
    .legend {
      position: absolute;
      bottom: 28px;
      right: 28px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px 20px;
      z-index: 100;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    /* D3 SVG Stilleri */
    .links line {
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 1.2px;
      transition: stroke 0.3s ease;
    }
    .nodes circle {
      stroke: #090a0f;
      stroke-width: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .nodes circle:hover {
      stroke: #ffffff;
      stroke-width: 3px;
      filter: drop-shadow(0 0 12px currentColor);
    }
    .node-label {
      font-size: 11px;
      font-weight: 600;
      fill: #e2e8f0;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    /* Tooltip */
    #tooltip {
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 200;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- Üst Arama & Kontrol Çubuğu -->
  <div class="top-bar">
    <input type="text" id="usernameInput" placeholder="Letterboxd Kullanıcı Adı" value="dave" />
    <button onclick="loadLetterboxd()">Ağımı Çiz</button>
    <button class="btn-secondary" onclick="loadSampleIMDb()">Örnek IMDb</button>
  </div>

  <!-- SVG Alanı -->
  <div id="canvas-container">
    <svg id="graph-svg"></svg>
  </div>

  <!-- Sol Bilgi Kartı -->
  <div class="archetype-card" id="archetypeCard">
    <div class="archetype-badge">Sinematik Zevk DNA'sı</div>
    <div class="archetype-title" id="archTitle">Yükleniyor...</div>
    <div class="archetype-tagline" id="archTagline">Sinema profiliniz analiz ediliyor</div>
    <div class="archetype-desc" id="archDesc">Lütfen bekleyin...</div>
    <div class="tags" id="archTags"></div>
  </div>

  <!-- Lejant -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background: #00f2fe; box-shadow: 0 0 8px #00f2fe;"></div><span>Türler (Büyük Düğümler)</span></div>
    <div class="legend-item"><div class="legend-dot" style="background: #f9d423; box-shadow: 0 0 8px #f9d423;"></div><span>Yönetmenler (Sarı)</span></div>
    <div class="legend-item"><div class="legend-dot" style="background: #ffffff; box-shadow: 0 0 8px #ffffff;"></div><span>Kilit Yapımlar (Beyaz)</span></div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip"></div>

  <script>
    const svg = d3.select("#graph-svg");
    const container = document.getElementById("canvas-container");
    let width = container.clientWidth;
    let height = container.clientHeight;

    const g = svg.append("g");

    // Zoom & Pan
    const zoom = d3.zoom()
      .scaleExtent([0.2, 4])
      .on("zoom", (event) => {
        g.attr("transform", event.transform);
      });
    svg.call(zoom);

    let simulation;

    function renderGraph(graphData) {
      g.selectAll("*").remove();

      // Arketip Kartını Güncelle
      const arch = graphData.archetype;
      document.getElementById("archTitle").innerText = arch.title;
      document.getElementById("archTagline").innerText = arch.tagline;
      document.getElementById("archDesc").innerText = arch.description;

      const tagsContainer = document.getElementById("archTags");
      tagsContainer.innerHTML = "";
      arch.dominant_genres.forEach(genre => {
        const span = document.createElement("span");
        span.className = "tag";
        span.innerText = "# " + genre;
        tagsContainer.appendChild(span);
      });
      if (arch.cinematic_era) {
        const eraSpan = document.createElement("span");
        eraSpan.className = "tag";
        eraSpan.innerText = "⏳ " + arch.cinematic_era;
        tagsContainer.appendChild(eraSpan);
      }

      // D3 Force Simulation
      simulation = d3.forceSimulation(graphData.nodes)
        .force("link", d3.forceLink(graphData.edges).id(d => d.id).distance(d => {
          return d.relation === "has_genre" ? 80 : 120;
        }).strength(0.6))
        .force("charge", d3.forceManyBody().strength(d => {
          return d.type === "genre" ? -400 : -180;
        }))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(d => d.size + 15));

      // Kenarlar
      const link = g.append("g")
        .attr("class", "links")
        .selectAll("line")
        .data(graphData.edges)
        .enter().append("line")
        .attr("stroke-opacity", 0.3)
        .attr("stroke", d => {
          if (d.relation === "co_genre") return "#00f2fe";
          if (d.relation === "directed_by") return "#f9d423";
          return "#ffffff";
        });

      // Düğümler
      const node = g.append("g")
        .attr("class", "nodes")
        .selectAll("g")
        .data(graphData.nodes)
        .enter().append("g")
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended));

      node.append("circle")
        .attr("r", d => d.size)
        .attr("fill", d => d.color)
        .style("filter", d => `drop-shadow(0 0 ${d.type === 'genre' ? 10 : 5}px ${d.color})`);

      node.append("text")
        .attr("class", "node-label")
        .attr("text-anchor", "middle")
        .attr("dy", d => d.size + 14)
        .text(d => d.label);

      // Tooltip Etkileşimi
      const tooltip = d3.select("#tooltip");
      node.on("mouseover", (event, d) => {
        tooltip.style("opacity", 1)
          .html(`
            <strong>${d.label}</strong><br/>
            <span style="color:#94a3b8">Tür: ${d.type.toUpperCase()}</span><br/>
            ${d.rating ? `<span>Puan: ⭐ ${d.rating}</span><br/>` : ''}
            ${d.year ? `<span>Yıl: ${d.year}</span>` : ''}
          `);
      })
      .on("mousemove", (event) => {
        tooltip.style("left", (event.pageX + 15) + "px")
               .style("top", (event.pageY - 15) + "px");
      })
      .on("mouseout", () => {
        tooltip.style("opacity", 0);
      });

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node.attr("transform", d => `translate(${d.x},${d.y})`);
      });
    }

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }

    // Letterboxd Verisi ile Ağ Çizdir
    async function loadLetterboxd() {
      const username = document.getElementById("usernameInput").value.trim() || "dave";
      document.getElementById("archTitle").innerText = "Veri Çekiliyor...";
      document.getElementById("archDesc").innerText = `${username} için Letterboxd verileri ve TMDB metadata taranıyor...`;

      try {
        const syncResp = await fetch("/api/v1/sync/letterboxd-url", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: username })
        });
        const syncData = await syncResp.json();

        const graphResp = await fetch("/api/v1/graph/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(syncData.items)
        });
        const graphData = await graphResp.json();
        renderGraph(graphData);
      } catch (err) {
        alert("Ağ yüklenirken hata oluştu: " + err);
      }
    }

    // Örnek IMDb Verisi ile Ağ Çizdir
    async function loadSampleIMDb() {
      document.getElementById("archTitle").innerText = "IMDb Yükleniyor...";
      const sampleTitles = [
        { title: "Inception", year: 2010, user_rating: 9.5, title_type: "movie" },
        { title: "Interstellar", year: 2014, user_rating: 9.0, title_type: "movie" },
        { title: "The Dark Knight", year: 2008, user_rating: 10.0, title_type: "movie" },
        { title: "Fight Club", year: 1999, user_rating: 8.5, title_type: "movie" },
        { title: "Se7en", year: 1995, user_rating: 9.0, title_type: "movie" },
        { title: "Breaking Bad", year: 2008, user_rating: 10.0, title_type: "tvSeries" },
        { title: "Dune", year: 2021, user_rating: 8.5, title_type: "movie" },
        { title: "Blade Runner 2049", year: 2017, user_rating: 9.0, title_type: "movie" },
        { title: "Oppenheimer", year: 2023, user_rating: 9.0, title_type: "movie" },
        { title: "Tenet", year: 2020, user_rating: 7.5, title_type: "movie" }
      ];

      const graphResp = await fetch("/api/v1/graph/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(sampleTitles)
      });
      const graphData = await graphResp.json();
      renderGraph(graphData);
    }

    // İlk açılışta otomatik olarak örnek IMDb verisini yükle
    window.addEventListener("DOMContentLoaded", () => {
      loadSampleIMDb();
    });

    window.addEventListener("resize", () => {
      width = container.clientWidth;
      height = container.clientHeight;
      if (simulation) {
        simulation.force("center", d3.forceCenter(width / 2, height / 2));
        simulation.alpha(0.3).restart();
      }
    });
  </script>
</body>
</html>
